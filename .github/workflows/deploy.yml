name: Deploy Telegram Bot via Docker

on:
  push:
    branches:
      - main # Deploys only on pushes to the main branch

env:
  # Configuration for the Docker image and container
  REGISTRY: ghcr.io
  CONTAINER_NAME: "japanese-analyzer-bot"
  IMAGE_REPO_NAME: "japanese-analyzer-bot"

jobs:
  # ====================================================================
  # JOB 1: Build the Docker image and push it to the GitHub Registry
  # ====================================================================
  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GitHub Container Registry

    outputs:
      image_uri: ${{ steps.get-primary-tag.outputs.primary_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        run: |
          echo "IMAGE_OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for tagging
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER_LC }}/${{ env.IMAGE_REPO_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get the primary image tag for deployment
        id: get-primary-tag
        run: |
          PRIMARY_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "primary_tag=$PRIMARY_TAG" >> $GITHUB_OUTPUT
        shell: bash

  # ====================================================================
  # JOB 2: Deploy the new Docker image to the production server
  # ====================================================================
  deploy-to-server:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-push-image # This job only runs if the build job succeeds
    environment: production

    steps:
      - name: Validate secrets are present
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then echo "Error: SSH_HOST secret is not set." >&2; exit 1; fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then echo "Error: SSH_USER secret is not set." >&2; exit 1; fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then echo "Error: SSH_PRIVATE_KEY secret is not set." >&2; exit 1; fi
          if [ -z "${{ secrets.GHCR_PULL_TOKEN }}" ]; then echo "Error: GHCR_PULL_TOKEN secret is not set." >&2; exit 1; fi
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then echo "Error: TELEGRAM_BOT_TOKEN secret is not set." >&2; exit 1; fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then echo "Error: GEMINI_API_KEY secret is not set." >&2; exit 1; fi
        shell: bash

      - name: Set up SSH key for server access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server via SSH
        env:
          TARGET_SSH_HOST: ${{ secrets.SSH_HOST }}
          TARGET_SSH_USER: ${{ secrets.SSH_USER }}
          FULL_IMAGE_URI: ${{ needs.build-and-push-image.outputs.image_uri }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          # Pass application secrets to the container
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VISION_MODEL: ${{ secrets.GEMINI_VISION_MODEL || 'gemini-pro-vision' }}
          GEMINI_TEXT_MODEL: ${{ secrets.GEMINI_TEXT_MODEL || 'gemini-pro' }}
        run: |
          # Add the server's host key to known_hosts to avoid interactive prompts
          ssh-keyscan -H "${TARGET_SSH_HOST}" >> ~/.ssh/known_hosts

          # Connect to the server and execute deployment commands.
          ssh -o StrictHostKeyChecking=no "${TARGET_SSH_USER}@${TARGET_SSH_HOST}" "
            set -ex

            # Log in to GitHub Container Registry to pull the private image
            echo '${GHCR_PULL_TOKEN}' | sudo docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin

            # Create the systemd service file using a heredoc for clarity and safety.
            # This service file manages the container and injects the necessary environment variables.
            sudo tee /etc/systemd/system/${CONTAINER_NAME}.service > /dev/null <<EOF
            [Unit]
            Description=${CONTAINER_NAME} Docker Container
            Requires=docker.service
            After=docker.service network.target

            [Service]
            Restart=always
            RestartSec=10
            Environment=\"TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}\"
            Environment=\"GEMINI_API_KEY=${GEMINI_API_KEY}\"
            Environment=\"GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL}\"
            Environment=\"GEMINI_TEXT_MODEL=${GEMINI_TEXT_MODEL}\"

            ExecStartPre=-/usr/bin/docker stop ${CONTAINER_NAME}
            ExecStartPre=-/usr/bin/docker rm ${CONTAINER_NAME}
            ExecStartPre=/usr/bin/docker pull ${FULL_IMAGE_URI}
            ExecStart=/usr/bin/docker run --rm --name ${CONTAINER_NAME} \
              -e TELEGRAM_BOT_TOKEN \
              -e GEMINI_API_KEY \
              -e GEMINI_VISION_MODEL \
              -e GEMINI_TEXT_MODEL \
              ${FULL_IMAGE_URI}
            ExecStop=/usr/bin/docker stop ${CONTAINER_NAME}

            [Install]
            WantedBy=multi-user.target
            EOF

            # Reload systemd, enable the service to start on boot, and restart it to apply changes
            sudo systemctl daemon-reload
            sudo systemctl enable '${CONTAINER_NAME}.service'
            sudo systemctl restart '${CONTAINER_NAME}.service'

            echo 'Deployment of ${CONTAINER_NAME} finished successfully.'
          "
        shell: bash